# DSA Exam Portal - Docker Compose
# PostgreSQL is expected to run on the host machine (not in Docker).
# See README.md for instructions.

services:
  # ─────────────────────────────────────────────
  # Judge0 Server (Code Execution API)
  # ─────────────────────────────────────────────
  judge0-server:
    image: judge0/judge0:1.13.1
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0password
      - REDIS_URL=redis://:judge0password@redis:6379
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=exam_user
      - POSTGRES_PASSWORD=exam_password
      - RAILS_MAX_THREADS=5
      - RAILS_ENV=production
      - ALLOW_ORIGIN=*
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    restart: unless-stopped
    networks:
      - exam-network

  # ─────────────────────────────────────────────
  # Judge0 Workers (process code submissions)
  # ─────────────────────────────────────────────
  judge0-workers:
    image: judge0/judge0:1.13.1
    command: bash -c "while true; do rails resque:work; done"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0password
      - REDIS_URL=redis://:judge0password@redis:6379
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=exam_user
      - POSTGRES_PASSWORD=exam_password
      - RAILS_MAX_THREADS=5
      - RAILS_ENV=production
      - QUEUE=*
      - COUNT=2
    depends_on:
      - redis
      - judge0-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    restart: unless-stopped
    networks:
      - exam-network

  # ─────────────────────────────────────────────
  # Redis (required by Judge0 for job queue)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "judge0password"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - exam-network

  # ─────────────────────────────────────────────
  # Backend API (Express + Prisma)
  # Optional: Uncomment to run backend in Docker
  # ─────────────────────────────────────────────
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     - DATABASE_URL=postgresql://exam_user:exam_password@host.docker.internal:5432/exam_portal?schema=public
  #     - JWT_SECRET=your-super-secret-jwt-key
  #     - REDIS_URL=redis://redis:6379
  #     - JUDGE0_URL=http://judge0-server:2358
  #     - CORS_ORIGIN=http://localhost:3000
  #     - PORT=4000
  #     - NODE_ENV=production
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     - redis
  #     - judge0-server
  #   restart: unless-stopped
  #   networks:
  #     - exam-network

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # Optional: Uncomment to run frontend in Docker
  # ─────────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:4000/api
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - exam-network

  # ─────────────────────────────────────────────
  # Optional: Dockerized PostgreSQL (port 5433)
  # Uncomment ONLY if you don't have local PostgreSQL.
  # ─────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   ports:
  #     - "5433:5432"  # Note: 5433 on host to avoid conflict with local PostgreSQL
  #   environment:
  #     - POSTGRES_DB=exam_portal
  #     - POSTGRES_USER=exam_user
  #     - POSTGRES_PASSWORD=exam_password
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - exam-network

networks:
  exam-network:
    driver: bridge

volumes:
  redis-data:
  # postgres-data:  # Uncomment if using Dockerized PostgreSQL
